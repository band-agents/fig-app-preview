<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/fig-app-preview/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FIG: forty international fashion brands, delivered free anywhere in Egypt.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FIG">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FIG</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown while the app downloads, so a slow connection sees FIG rather than a blank page. */
    #fig-splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center;
      justify-content: center; background: #fff; transition: opacity .35s ease; }
    #fig-splash span { font: 700 34px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: .04em; color: #0F0F10; animation: fig-breathe 1.6s ease-in-out infinite; }
    @keyframes fig-breathe { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
  </style>
</head>
<body>
  <div id="fig-splash" aria-hidden="true"><span>FIG</span></div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var splash = document.getElementById("fig-splash");
      if (!splash) return;
      splash.style.opacity = "0";
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Paymob's card form inside the checkout (browser build only). Loads Pixel itself, on demand. -->
  <script src="paymob_pixel.js?v=2" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
